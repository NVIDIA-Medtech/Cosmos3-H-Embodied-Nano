# Installs the ``cosmos3_h_embodied`` package (Open-H surgical training and inference on
# cosmos-framework). Install cosmos-framework first (validated at revision 7cfaf78, see
# README.md), then: ``pip install -e .`` in the same environment.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos3-h-embodied"
version = "0.1.0"
description = "Cosmos3-H-Embodied-Nano: Open-H surgical robotics recipes (H16 action history) on cosmos-framework"
authors = [{ name = "NVIDIA Corporation" }]
requires-python = ">=3.10,<3.14"
license = { text = "OpenMDW-1.1" }
readme = "README.md"
dependencies = [
  "cosmos-framework",
]

[tool.hatch.build.targets.wheel]
packages = ["cosmos3_h_embodied"]

[tool.hatch.build.targets.sdist]
include = ["cosmos3_h_embodied", "tools", "pyproject.toml"]
